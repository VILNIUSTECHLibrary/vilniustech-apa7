name: LaTeX test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            scheme-basic
            latex
            latexmk
            biber
            biblatex
            biblatex-apa
            csquotes
            babel
            babel-english

      - name: Run test
        working-directory: test
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -use-biber test.tex
        
